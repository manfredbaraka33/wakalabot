name: Deploy WakalaBot

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: wakalabot
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/wakalabot/wakalabot
            git fetch origin main
            git reset --hard origin/main

            source backend/env/bin/activate
            pip install -r backend/requirements.txt

            cd backend && alembic upgrade head && cd ..

            sudo systemctl restart wakalabot
            sleep 3
            curl -f http://127.0.0.1:8000/health || (echo "❌ Health check failed" && exit 1)
            echo "✅ Backend deployed and healthy"

      - name: Sync frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: wakalabot
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "/home/wakalabot/wakalabot/frontend/dist"
          strip_components: 2